<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 325 64" fill="none" width="100%" height="100%">
  <!-- Architectural Mark: Interlocking A & H structure with horizon beam -->
  <g transform="translate(10, 10)">
    <!-- Outer precision diamond frame -->
    <path d="M30 0 L60 30 L30 60 L0 30 Z" stroke="#c85a32" stroke-width="1.5" fill="none" opacity="0.4"/>
    
    <!-- Primary Structural A-frame -->
    <path d="M30 10 L48 50 H12 Z" stroke="#F4F3EF" stroke-width="3.5" stroke-linejoin="round" fill="none"/>
    
    <!-- Horizon Crossbeam extending past A-frame -->
    <line x1="4" y1="36" x2="56" y2="36" stroke="#c85a32" stroke-width="3" stroke-linecap="square"/>
    
    <!-- Vertical structural pillar (H axis) -->
    <line x1="30" y1="36" x2="30" y2="50" stroke="#F4F3EF" stroke-width="3" stroke-linecap="square"/>
  </g>
  
  <!-- Wordmark -->
  <text x="85" y="38" fill="#F4F3EF" font-family="'Plus Jakarta Sans', 'Inter', 'Space Grotesk', sans-serif" font-size="24" font-weight="800" letter-spacing="0.18em">ATLAS</text>
  <text x="85" y="58" fill="#c85a32" font-family="'Plus Jakarta Sans', 'Inter', 'Space Grotesk', sans-serif" font-size="13" font-weight="600" letter-spacing="0.35em">HORIZON</text>
</svg>
